name: Neo Agent Orchestration

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'products/Neo.AgentOrchestration/**'
      - 'src/**'
      - '.github/workflows/agent-orchestration.yml'
  pull_request:
    paths:
      - 'products/Neo.AgentOrchestration/**'
      - 'src/**'
      - '.github/workflows/agent-orchestration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore product
        run: dotnet restore products/Neo.AgentOrchestration/Neo.AgentOrchestration.slnx
      - name: Build product
        run: dotnet build products/Neo.AgentOrchestration/Neo.AgentOrchestration.slnx -c Release --no-restore -m:1
      - name: Test product
        run: dotnet test products/Neo.AgentOrchestration/tests/Neo.AgentOrchestration.Tests/Neo.AgentOrchestration.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=agent-orchestration.trx"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-orchestration-test-results
          path: '**/agent-orchestration.trx'

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore product
        run: dotnet restore products/Neo.AgentOrchestration/Neo.AgentOrchestration.slnx
      - name: Build local bundle
        shell: pwsh
        run: ./products/Neo.AgentOrchestration/tools/Package-Local.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/.artifacts/neo-agent-orchestration-local"
      - name: Upload local bundle
        uses: actions/upload-artifact@v4
        with:
          name: neo-agent-orchestration-local-${{ github.sha }}
          path: |
            .artifacts/neo-agent-orchestration-local.zip
            .artifacts/neo-agent-orchestration-local/MANIFEST.json

  deploy-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: package
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: neo-agent-orchestration-development
      cancel-in-progress: true
    steps:
      - name: Download local bundle
        uses: actions/download-artifact@v4
        with:
          name: neo-agent-orchestration-local-${{ github.sha }}
          path: bundle
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Upload and activate development release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ARCHIVE: bundle/neo-agent-orchestration-local.zip
        run: |
          scp "$ARCHIVE" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/neo-agent-orchestration-${GITHUB_SHA}.zip"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/neo-agent-orchestration-deploy development '$GITHUB_SHA' '/tmp/neo-agent-orchestration-${GITHUB_SHA}.zip'"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: package
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: neo-agent-orchestration-production
      cancel-in-progress: false
    steps:
      - name: Download local bundle
        uses: actions/download-artifact@v4
        with:
          name: neo-agent-orchestration-local-${{ github.sha }}
          path: bundle
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Upload and activate production release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ARCHIVE: bundle/neo-agent-orchestration-local.zip
        run: |
          scp "$ARCHIVE" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/neo-agent-orchestration-${GITHUB_SHA}.zip"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/neo-agent-orchestration-deploy production '$GITHUB_SHA' '/tmp/neo-agent-orchestration-${GITHUB_SHA}.zip'"
