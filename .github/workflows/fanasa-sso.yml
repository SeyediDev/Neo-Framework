name: Neo Fanasa Identity

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'products/Neo.FanasaIdentity/**'
      - '.github/workflows/fanasa-identity.yml'
      - 'Directory.*'
      - 'src/Neo.Common/**'
  pull_request:
    paths:
      - 'products/Neo.FanasaIdentity/**'
      - '.github/workflows/fanasa-identity.yml'
      - 'Directory.*'
      - 'src/Neo.Common/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore products/Neo.FanasaIdentity/Neo.FanasaIdentity.slnx
      - name: Build
        run: dotnet build products/Neo.FanasaIdentity/Neo.FanasaIdentity.slnx -c Release --no-restore -m:1
      - name: Test
        run: dotnet test products/Neo.FanasaIdentity/tests/Neo.FanasaIdentity.Tests/Neo.FanasaIdentity.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=fanasa-identity.trx"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanasa-identity-test-results
          path: '**/fanasa-identity.trx'
