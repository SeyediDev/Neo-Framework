name: Neo durable event delivery
on:
  push:
    paths: ['src/**', 'tools/Neo.Companion/**', 'Directory.*.props', '.github/workflows/durable-messaging.yml']
  pull_request:
    paths: ['src/**', 'tools/Neo.Companion/**', 'Directory.*.props', '.github/workflows/durable-messaging.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-events:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start isolated database and broker
        run: docker compose -f tools/Neo.Companion/samples/DurableMessagingDemo/compose.yaml up -d --wait
      - name: Build durable demo
        run: dotnet build tools/Neo.Companion/samples/DurableMessagingDemo/DurableMessagingDemo.csproj -c Release
      - name: Verify rollback, restart, two workers and compensation
        run: python tools/Neo.Companion/scripts/smoke_durable_messaging.py --server-dll tools/Neo.Companion/samples/DurableMessagingDemo/bin/Release/net10.0/DurableMessagingDemo.dll
      - name: Service logs
        if: failure()
        run: docker compose -f tools/Neo.Companion/samples/DurableMessagingDemo/compose.yaml logs
      - name: Stop isolated services
        if: always()
        run: docker compose -f tools/Neo.Companion/samples/DurableMessagingDemo/compose.yaml down
