# OFFLINE proposal. Requires reviewed external-config/source decision and native lint.
# No image: exact root-controlled Runner default; no in-place image tag overwrite.
workflow:
  rules:
    - if: '$CI_PROJECT_ID == "1" && $CI_PROJECT_PATH == "fanasa/neo-framework" && $CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "push")'
    - when: never
stages: [verify]
default:
  tags: [fanasa-neo-committed-verification]
  interruptible: false
  retry: 0
  timeout: 30m
  artifacts:
    when: always
    access: maintainer
    expire_in: 7 days
    paths: [.ci-reports/]
variables:
  GIT_DEPTH: "0"
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: none
  GIT_LFS_SKIP_SMUDGE: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_PROCESSOR_COUNT: "2"
  NUGET_PACKAGES: /home/neo-ci/.nuget/packages
secrets:
  stage: verify
  script: ["python3 /opt/fanasa-ci/run.py secrets"]
  allow_failure: false
core-unit:
  stage: verify
  script: ["python3 /opt/fanasa-ci/run.py core-unit"]
  allow_failure: false
portal-contract:
  stage: verify
  script: ["python3 /opt/fanasa-ci/run.py portal-contract"]
  allow_failure: false
financial-contract:
  stage: verify
  script: ["python3 /opt/fanasa-ci/run.py financial-contract"]
  allow_failure: false
portal-node:
  stage: verify
  script: ["python3 /opt/fanasa-ci/run.py portal-node"]
  allow_failure: false
financial-node:
  stage: verify
  script: ["python3 /opt/fanasa-ci/run.py financial-node"]
  allow_failure: false
