# Include inside the existing HTTPS server for app.fanasacloud.ir.
# Retain its certificates, root redirect, auth settings and all other locations.
location = /apps {
    return 308 /apps/;
}

location ^~ /apps/ {
    alias /site/app-directory/current/;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
