# Include inside the existing Fanasa edge's http context after certificates are provisioned.
# The auth endpoint is internal; identity is checked by the HR JWT boundary over pinned mTLS.
limit_req_zone $binary_remote_addr zone=fanasa_hr_development:1m rate=5r/s;
server {
    listen 443 ssl;
    server_name api.fanasa.net.local;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    location = /development/organization-hr { return 302 https://platform.fanasa.net.local/OrganizationHr; }
    location = /_fanasa_hr_access {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass https://127.0.0.1:5193/api/organization-hr/v1/tenants/$hr_tenant/gateway-access?operation=$hr_operation;
        include /certs/organization-hr-proxy.conf;
    }
    location ~ "^/development/organization-hr/v1/tenants/(?<hr_tenant>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/(?<hr_read_path>chart|history/[1-9][0-9]*)$" {
        if ($request_method != GET) { return 405; }
        set $hr_operation read;
        auth_request /_fanasa_hr_access;
        limit_req zone=fanasa_hr_development burst=10 nodelay;
        limit_req_status 429;
        proxy_pass https://127.0.0.1:5193/api/organization-hr/v1/tenants/$hr_tenant/$hr_read_path;
        include /certs/organization-hr-proxy.conf;
    }
    location ~ "^/development/organization-hr/v1/tenants/(?<hr_tenant>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/commands$" {
        if ($request_method != POST) { return 405; }
        set $hr_operation write;
        auth_request /_fanasa_hr_access;
        limit_req zone=fanasa_hr_development burst=10 nodelay;
        limit_req_status 429;
        proxy_pass https://127.0.0.1:5193/api/organization-hr/v1/tenants/$hr_tenant/commands;
        include /certs/organization-hr-proxy.conf;
    }
    location / { return 404; }
}
