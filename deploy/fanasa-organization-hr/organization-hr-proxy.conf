proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_trusted_certificate /certs/organization-hr-ca.crt;
proxy_ssl_server_name on;
proxy_ssl_name organization-hr-upstream.fanasa.net.local;
proxy_ssl_certificate /certs/organization-hr-gateway.crt;
proxy_ssl_certificate_key /certs/organization-hr-gateway.key;
proxy_ssl_session_reuse on;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
proxy_set_header Host organization-hr-upstream.fanasa.net.local;
proxy_set_header Authorization $http_authorization;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host api.fanasa.net.local;
proxy_set_header X-Forwarded-Client-Cert "";
proxy_set_header X-SSL-Client-Cert "";
proxy_set_header X-Tenant-Id "";
proxy_set_header X-Actor "";
proxy_set_header X-Permission "";
proxy_set_header Cookie "";
proxy_set_header Connection "";
