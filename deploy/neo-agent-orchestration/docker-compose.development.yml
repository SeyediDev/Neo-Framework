services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: neo-orchestration-sql-development
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - neo_orchestration_sql_development:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  neo_orchestration_sql_development:
    name: neo_orchestration_sql_development
