services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: ["127.0.0.1:14333:1433"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${NEO_CRUD_SQL_PASSWORD:?Set an ephemeral SQL test password}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
