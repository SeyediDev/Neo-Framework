services:
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: neo_demo
      RABBITMQ_DEFAULT_PASS: neo_demo_local_only
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: ["127.0.0.1:14333:1433"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Neo_demo_2026_Only!
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
    volumes: ["sqlserver-data:/var/opt/mssql"]
volumes:
  rabbitmq-data:
  sqlserver-data:
