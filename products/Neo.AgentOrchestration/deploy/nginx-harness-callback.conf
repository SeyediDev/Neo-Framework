# Include INSIDE the product's existing HTTPS server block, before its Web fallback.
# Adapt only the operator-owned loopback API port if the installation differs.
# Keep API callback-key validation enabled; this is routing, not authorization.
location ~ ^/api/orchestration/v1/organizations/[0-9a-fA-F-]+/workspaces/[0-9a-fA-F-]+/harness/[A-Za-z0-9_-]+/runs/[0-9a-fA-F-]+/result$ {
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:18110;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
}
